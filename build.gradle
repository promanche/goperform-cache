import java.time.LocalDate

/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'io.freefair.lombok' version '6.5.0.2'

    /*
     * Note that 9.3.0 introduces JAVA_OPTS but 9.3.1 rolls it back due to errors in some configurations.
     * Check https://bmuschko.github.io/gradle-docker-plugin/current/user-guide/#change_log for further development.
     */
    id 'com.bmuschko.docker-spring-boot-application' version '9.3.0'

    id 'com.gorylenko.gradle-git-properties' version '2.4.1'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "$nexusUrl/repository/maven-gostream-utils"
        credentials {
            username nexusUsername
            password nexusPassword
        }
    }
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'org.springframework.security:spring-security-messaging'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'io.nats:jnats:2.15.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.postgresql:postgresql'
    implementation 'ru.geosteering:common-models:1.14.0'
    implementation 'ru.geosteering:witsml-library:1.1.10'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.liquibase:liquibase-core:4.18.0'
}

group = 'ru.geosteering'
version = generateVersion()
description = 'goperform-cache'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

docker {
    springBootApplication {
        baseImage = "eclipse-temurin:17-jre-alpine"
        ports = [9010]
        images = ["$dockerTargetRegistryUrl/gostream/goperform-cache-service:${getCurrentGitBranch()}_${version}",
                  "$dockerTargetRegistryUrl/gostream/goperform-cache-service:${getCurrentGitBranch()}_latest"]
    }
}

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.message.full', 'git.commit.time']
    dateFormat = "dd-MM-yyyy HH:mm Z"
}

springBoot {
    buildInfo()
}

def generateVersion() {
    def workDir = new File("${projectDir}")
    def date = LocalDate.now().toString().replaceAll("-", "")
    def commit = 'git rev-parse --short HEAD'.execute(null, workDir).text.trim()
    return date + "_" + commit
}

def getCurrentGitBranch() {
    def gitBranch = ""
    def workingDir = new File("${projectDir}")
    def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
    result.waitFor()
    if (result.exitValue() == 0) {
        gitBranch = result.text.trim()
    }
    return gitBranch
}