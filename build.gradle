import java.time.LocalDate
import com.bmuschko.gradle.docker.tasks.image.Dockerfile

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'io.freefair.lombok' version '6.5.0.2'
    id 'com.bmuschko.docker-spring-boot-application' version '9.3.0'

    id 'com.gorylenko.gradle-git-properties' version '2.4.1'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "$nexusUrl/repository/maven-gostream-utils"
        credentials {
            username nexusUsername
            password nexusPassword
        }
    }
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.security:spring-security-messaging'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'io.nats:jnats:2.15.3'

    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'ru.geosteering:common-models:1.28.0'
    implementation 'ru.geosteering:witsml-library:1.6.0'

    implementation 'org.postgresql:postgresql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'org.liquibase:liquibase-core:4.18.0'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    implementation 'biz.paluch.logging:logstash-gelf:1.14.1'
}

group = 'ru.geosteering'
version = generateVersion()
description = 'goperform-cache'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

docker {
    springBootApplication {
        baseImage = "eclipse-temurin:17-jre-alpine"
        ports = [9010]
        images = ["$dockerTargetRegistryUrl/gostream/goperform-cache-service:${getDockerImageTag()}_${version}",
                  "$dockerTargetRegistryUrl/gostream/goperform-cache-service:${getDockerImageTag()}_latest"]
    }
}
tasks.named('dockerCreateDockerfile', Dockerfile) {
    runCommand 'apk --update --no-cache add curl'
}

gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.message.full', 'git.commit.time']
    dateFormat = "dd-MM-yyyy HH:mm Z"
}

springBoot {
    buildInfo()
}

def generateVersion() {
    def workDir = new File("${projectDir}")
    def date = LocalDate.now().toString().replaceAll("-", "")
    def commit = 'git rev-parse --short HEAD'.execute(null, workDir).text.trim()
    return date + "_" + commit
}

def getCurrentGitBranch() {
    def gitBranch = ""
    def workingDir = new File("${projectDir}")
    def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
    result.waitFor()
    if (result.exitValue() == 0) {
        gitBranch = result.text.trim()
    }
    return gitBranch
}

def getDockerImageTag() {
    def branchName = getCurrentGitBranch()
    return branchName.replaceAll('/', '_')
}