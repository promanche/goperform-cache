#-----Web-----
server.http2.enabled=true
server.servlet.context-path=/cache/api

#-----DataService-----
goperform.dataservice-baseurl=http://demo.geosteering.ru/api

#-----Actuator-----
management.endpoints.enabled-by-default=false
management.endpoint.info.enabled=true
management.info.git.enabled=true
management.info.git.mode=full
management.endpoints.web.exposure.include=info

#-----Database-----
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/test
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=6

#-----Nats connection-----
goperform.subject=gostream.curves
goperform.host=opentls://nats.geosteering.ru:4222
goperform.credentials-file=creds/app.creds
goperform.reconnect-timeout-sec=10

#-----Message processing-----
goperform.realtime-threads=2
goperform.history-threads=6
goperform.history-request-limit=15000
goperform.nats-onetime-requests=4

#-----Data storage-----
goperform.batch-size=1000
goperform.margin-size=20

#-----Scaling-----
goperform.scale-minutes={1,2,5,10,15,30,60,180,360,720,1440,10080}

#-----Statistic-----
goperform.statistic-period-sec=30
#-----Logging-----
logging.config=${LOG_CONFIG:classpath:logback-spring.xml}
logging.graylog.host=udp:graylog.geosteering.ru
logging.graylog.port=12201
#logging.file.path=logs
#logging.file.name=logs/goperform-cache.log
#logging.logback.rollingpolicy.file-name-pattern=logs/goperform-cache-%d{yyyy-MM-dd}.%i.log
#logging.level.ru.geosteering.goperform.cache=info
#logging.level.org.springframework.security=debug
#logging.level.org.springframework.web.socket=debug
#logging.level.org.springframework.messaging=debug
#logging.level.ru.geosteering.goperform.cache.repository=info
#logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=info

spring.task.scheduling.pool.size=6

#-----Liquibase-----
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml