# Web
server.http2.enabled=true
server.servlet.context-path=/cache/api

# ApiService
goperform.dataservice-baseurl=${GOSTREAM_DATA_SERVICE_URL:http://localhost:9002/api}
goperform.api-service.username=${GOSTREAM_USERNAME:alice}
goperform.api-service.password=${GOSTREAM_PASSWORD:12345}

# Actuator and Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.jmx.exposure.include=health,info
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram."[http.server.requests]"=true

# Database
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/goperform_cache}
spring.datasource.username=${DB_USR:goperform_cache}
spring.datasource.password=${DB_PSW:goperform_cache}
spring.datasource.hikari.maximum-pool-size=30

# NATS connection
goperform.subject=gostream.curves
goperform.host=${NATS_URL:nats://localhost:4222}
goperform.credentials-file=app.creds
goperform.reconnect-timeout-sec=10

# Message processing
goperform.realtime-threads=4
goperform.history-threads=8
goperform.history-request-limit=15000
goperform.nats-onetime-requests=4

# Data storage
goperform.batch-size=1000
goperform.margin-size=200

# Scaling
goperform.scale-minutes={1,2,5,10,15,30,60,180,360,720,1440,10080}

# Statistic
goperform.statistic-period-sec=30

# Logging
logging.config=${LOG_CONFIG:classpath:logback-local.xml}
logging.graylog.host=udp:graylog.geosteering.ru
logging.graylog.port=12201
logging.graylog.source=${GRAYLOG_SOURCE:perform.geosteering.ru}
logging.app-name=GOperformCache

#Uncomment when you create prod build
#logging.level.ru.geosteering.goperform.cache=info
#logging.level.ru.geosteering.goperform.cache.processor.SingleCurveProcessor=debug
#logging.level.ru.geosteering.goperform.cache.processor.CurveDispatcher=debug
#logging.level.ru.geosteering.goperform.cache.repository.MainRepository=debug
#logging.level.ru.geosteering.goperform.cache.service.CurveService=debug

# Scheduling
spring.task.scheduling.pool.size=6

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#Auto-cleaning
goperform.cleaning.curve.days=${DAYS_BEFORE_CURVE_REMOVE:30}
goperform.cleaning.processor.days=${DAYS_BEFORE_PROCESSOR_REMOVE:7}

spring.codec.max-in-memory-size=100MB