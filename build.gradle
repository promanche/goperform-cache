import com.bmuschko.gradle.docker.tasks.image.DockerBuildImage
import com.bmuschko.gradle.docker.tasks.image.DockerPushImage

plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '2.7.0'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'io.freefair.lombok' version '6.5.0.2'
    id 'com.bmuschko.docker-spring-boot-application' version '9.3.0'
    id 'application'
}

application {
    mainClass = 'ru.geosteering.goperform.cache.GoperformCacheApplication'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "$nexusUrl/repository/maven-gostream-utils"
        allowInsecureProtocol = true
        credentials {
            username nexusUsername
            password nexusPassword
        }
    }
}

dependencies {
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.security:spring-security-messaging'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    implementation 'io.nats:jnats:2.15.3'

    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'ru.geosteering:common-models:1.28.0'
    implementation 'ru.geosteering:witsml-library:1.6.0'

    implementation 'org.postgresql:postgresql'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'org.liquibase:liquibase-core:4.18.0'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'

    implementation 'biz.paluch.logging:logstash-gelf:1.14.1'
}

group = 'ru.geosteering.goperform.cache.service'
version = '1.4.0-SNAPSHOT'
description = 'goperform-cache'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

task copyJarToDockerDir(type: Copy) {
    dependsOn bootJar
    from 'build/libs/'
    include '*.jar'
    into 'docker/app/'
    rename {
        String filename -> filename.replace("-$project.version", "").replace("-all", "")
    }
}

static def mapBranchNameToDockerImageTag(branchName) {
    if (branchName == 'master') {
        return 'latest'
    } else {
        return branchName.replaceAll('\\W', '_')
    }
}

def getCurrentGitBranch() {
    def gitBranch = 'unknown'
    try {
        def workingDir = new File("${project.projectDir}")
        def result = 'git rev-parse --abbrev-ref HEAD'.execute(null, workingDir)
        result.waitFor()
        if (result.exitValue() == 0) {
            gitBranch = result.text.trim()
        }
    } catch (ignored) {
    }
    return gitBranch
}

def getDockerImageTag() {
    def branchName
    if (project.hasProperty('branchName')) {
        branchName = project.getProperty('branchName')
    } else {
        branchName = getCurrentGitBranch()
    }
    return mapBranchNameToDockerImageTag(branchName)
}

task buildDockerImage(type: DockerBuildImage) {
    dependsOn copyJarToDockerDir
    inputDir = file('docker')

    def dockerImageTag = getDockerImageTag()
    images = ['nexus.geosteering.ru:5001/gostream/goperform-cache-service:' + dockerImageTag]

    if (dockerImageTag.startsWith("release")) {
        images.add('lib.geosteering.ru:5001/gostream/goperform-cache-service:' + dockerImageTag)
    }

}

task pushDockerImage(type: DockerPushImage) {
    dependsOn buildDockerImage
    images = buildDockerImage.images
}

docker {
    springBootApplication {
        baseImage = "eclipse-temurin:17-jre-alpine"
        ports = [9010]
        images = ["nexus.geosteering.ru:5001/gostream/goperform-cache-service:latest"]
    }
}

processResources {
    filesMatching('application.properties') {
        filter {
            it.replace('@application.version@', version)
        }
    }
}